<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Grand</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main>
        <header>
             <h2>Aura Grand</h2>

             <nav>
                <a href="#">Home</a>
                <a href="#">Rooms</a>
                <a href="#">Amenities</a>
                <a href="#">About Us</a>
                <a href="#">Gallery</a>

                <button class="book-now">Book Now</button>

                
             </nav>
             
        </header>
        <div class= "hero-image">
                    <img src="/assets/screen (5).png" alt="hero-image">
                    <div class="hero-text">
                        <h1>Stay Somewhere Exceptional</h1>
                        <p>Experience the pinnacle of luxury and comfort in the heart of the city</p><br><br>
                        <button class="book-your-stay">Book your Stay</button>
                        <button class="explore-rooms">Explore Rooms</button>
                </div>
                <div class="quick-availability">
                    <label for="check-in">CHECK-IN</label>
                    <input type="date" id="check-in"> 
                    <label for="check-out">CHECK-OUT</label>
                    <input type="date" id="check-out">
                    <label for="guests">GUESTS</label>
                    <select type="list" id="guests" name="guests">
                        <option value=""></option>
                        <option value="2 Adults, 0 Children">2 Adults, 0 Children</option>
                        <option value="1 Adult, 0 Children">1 Adult, 0 Children</option>
                        <option value="2 Adults, 1 Child">2 Adults, 1 Child</option>
                        <option value="1 Adult, 1 Child">1 Adult, 1 Child</option>
                    </select>
                    <label for="rooms">ROOMS</label>
                    <select type="list" id="rooms" name="rooms">
                        <option value=""></option>
                        <option value="1 Room">1 Room</option>
                        <option value="2 Rooms">2 Rooms</option>
                        <option value="3+ Rooms">3+ Rooms</option>
                    </select>                   
                    <button type="submit">Search Availability</button>
                </div>
                    </div>
                    <br>
                    <br>
                    <br>
                    <br>
                <div class="intro">
                    <h1>Unparalled Experiences</h1>
                    <p>Discover a world of refined luxury with our carefully curated amenities
                    designed to elevate your stay.
                    </p>
                </div>
    </main>
    <script src="/js/script.js"></script>
</body>
</html>
